# Rodavia - Docker Compose para desarrollo y producción
version: '3.8'

services:
  # Aplicación web principal
  rodavia-web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rodavia-web
    ports:
      - "80:8080"
      - "443:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD:-AutoGuia2025!}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetcore.pfx
      - ConnectionStrings__DefaultConnection=Host=rodavia-db;Database=autoguia;Username=autoguia;Password=${POSTGRES_PASSWORD:-AutoGuia2025!}
      - ConnectionStrings__AutoGuiaConnection=Host=rodavia-db;Database=autoguia;Username=autoguia;Password=${POSTGRES_PASSWORD:-AutoGuia2025!}
      - GoogleMaps__ApiKey=${GOOGLE_MAPS_API_KEY}
    depends_on:
      - rodavia-db
      - redis
    volumes:
      - ~/.aspnet/https:/https:ro
      - rodavia-logs:/app/logs
    networks:
      - rodavia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Sistema de scraping
  rodavia-scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: rodavia-scraper
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=rodavia-db;Database=autoguia;Username=autoguia;Password=${POSTGRES_PASSWORD:-AutoGuia2025!}
      - ScrapingSettings__RepuestosTotalBaseUrl=https://www.repuestostotal.cl
      - ScrapingSettings__IntervalMinutes=60
    depends_on:
      - rodavia-db
    volumes:
      - scraper-logs:/app/logs
    networks:
      - rodavia-network
    restart: unless-stopped

  # Base de datos PostgreSQL
  rodavia-db:
    image: postgres:15-alpine
    container_name: rodavia-db
    environment:
      POSTGRES_DB: autoguia
      POSTGRES_USER: autoguia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AutoGuia2025!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - rodavia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoguia -d autoguia"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    container_name: rodavia-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-Rodavia2025!}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - rodavia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # Adminer para administración de DB (desarrollo)
  adminer:
    image: adminer:latest
    container_name: rodavia-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: rodavia-db
    depends_on:
      - rodavia-db
    networks:
      - rodavia-network
    profiles:
      - dev
    restart: unless-stopped

# Volúmenes persistentes
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rodavia-logs:
    driver: local
  scraper-logs:
    driver: local

# Red interna para comunicación entre servicios
networks:
  rodavia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
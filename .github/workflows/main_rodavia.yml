# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Este workflow despliega automáticamente la aplicación Rodavia a Azure App Service
# cuando se hace push a la rama main o mediante ejecución manual.
#
# REQUISITOS:
# - Secretos requeridos en GitHub (Settings > Secrets):
#   * AZUREAPPSERVICE_CLIENTID_* (para autenticación federada)
#   * AZUREAPPSERVICE_TENANTID_*
#   * AZUREAPPSERVICE_SUBSCRIPTIONID_*
# - El App Service debe llamarse 'rodavia' en Azure
# - Usar .NET 8.x
#
# PASOS DEL WORKFLOW:
# 1. Checkout del código
# 2. Setup de .NET 8
# 3. Restore de dependencias
# 4. Build en modo Release
# 5. Publish de la aplicación
# 6. Upload del artifact
# 7. Deploy a Azure App Service
# 8. Notificación de éxito/fallo

name: Build and deploy ASP.Net Core app to Azure Web App - rodavia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: windows-latest
    permissions:
      contents: read  # This is required for actions/checkout

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🏗️ Build with dotnet
        run: dotnet build Rodavia.Web/Rodavia.Web/Rodavia.Web.csproj --configuration Release --no-restore

      - name: 📤 Publish application
        run: dotnet publish Rodavia.Web/Rodavia.Web/Rodavia.Web.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: 📦 Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    name: Deploy to Azure
    runs-on: windows-latest
    needs: build
    environment:
      name: production
      url: https://rodavia.azurewebsites.net
    permissions:
      id-token: write  # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout

    steps:
      - name: 📥 Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: 🔑 Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F30058E83D074DDAB853693A89BC5A84 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8E4E13FA377D4242BB4508CC5DB3C76C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B400291DBEA44229B55D00A16DFC81FF }}

      - name: 🚀 Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rodavia'
          slot-name: 'Production'
          package: .

      - name: ✅ Deployment completed
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "🌐 Application URL: https://rodavia.azurewebsites.net"

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: success()
    permissions:
      contents: none  # No permissions needed for notifications

    steps:
      - name: ✅ Success Notification
        run: |
          echo "══════════════════════════════════════════════"
          echo "✅ DEPLOYMENT - ALL STEPS COMPLETED"
          echo "══════════════════════════════════════════════"
          echo "📦 Build: ${{ needs.build.result }}"
          echo "🚀 Deploy: ${{ needs.deploy.result }}"
          echo "══════════════════════════════════════════════"
          echo "🎉 Application deployed successfully!"
          echo "🌐 URL: https://rodavia.azurewebsites.net"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()
    permissions:
      contents: none  # No permissions needed for notifications

    steps:
      - name: ❌ Failure Notification
        run: |
          echo "══════════════════════════════════════════════"
          echo "❌ DEPLOYMENT - FAILED"
          echo "══════════════════════════════════════════════"
          echo "📦 Build: ${{ needs.build.result }}"
          echo "🚀 Deploy: ${{ needs.deploy.result }}"
          echo "══════════════════════════════════════════════"
          echo "⚠️ Please review the failed jobs above"
          echo "📝 Check the logs for detailed error messages"
          echo "🔧 Common issues:"
          echo "   - Verify Azure credentials are valid"
          echo "   - Check app-name matches Azure App Service"
          echo "   - Ensure .NET version matches Azure runtime"

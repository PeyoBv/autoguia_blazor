# Workflow de Deploy a Azure con Configuración Avanzada
# Este workflow incluye:
# - Build y testing con cobertura
# - Deploy a Azure usando Azure credentials (Service Principal)
# - Configuración de App Settings
# - Migraciones de base de datos
# - Health checks post-deployment
# - Notificaciones de éxito/fallo
#
# REQUISITOS:
# - Secreto: AZURE_CREDENTIALS (Service Principal JSON)
#   Crear con: az ad sp create-for-rbac --name "rodavia-deploy" --role contributor
#              --scopes /subscriptions/{subscription-id}/resourceGroups/{resource-group}
#              --sdk-auth
# - Secretos adicionales (opcionales):
#   * GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (para OAuth)
#   * SMTP_USERNAME, SMTP_PASSWORD (para emails)
#   * SQL_CONNECTION_STRING (para migraciones)
#   * APPLICATIONINSIGHTS_CONNECTION_STRING
#   * SLACK_WEBHOOK (para notificaciones)
#
# NOTA: Este workflow usa autenticación con Service Principal en lugar de
#       Publish Profile. Es más seguro y permite mayor control sobre recursos.

name: Deploy Rodavia to Azure

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'rodavia-app'
  AZURE_WEBAPP_PACKAGE_PATH: './publish'
  DOTNET_VERSION: '8.0.x'
  RESOURCE_GROUP: 'rg-rodavia-prod'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore Rodavia.sln

      - name: 🏗️ Build solution
        run: dotnet build Rodavia.sln --configuration Release --no-restore

      - name: 🧪 Run unit tests
        run: |
          dotnet test Rodavia.Tests/Rodavia.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true

      - name: 📊 Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/test-results.trx'

      - name: 📤 Publish application
        run: |
          dotnet publish Rodavia.Web/Rodavia.Web/Rodavia.Web.csproj \
            --configuration Release \
            --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          retention-days: 1

  deploy-to-azure:
    name: Deploy to Azure
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: 🔑 Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: ⚙️ Configure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "ASPNETCORE_ENVIRONMENT",
                "value": "Production",
                "slotSetting": false
              },
              {
                "name": "Authentication__Google__ClientId",
                "value": "${{ secrets.GOOGLE_CLIENT_ID }}",
                "slotSetting": false
              },
              {
                "name": "Authentication__Google__ClientSecret",
                "value": "${{ secrets.GOOGLE_CLIENT_SECRET }}",
                "slotSetting": false
              },
              {
                "name": "EmailSettings__SmtpServer",
                "value": "smtp.gmail.com",
                "slotSetting": false
              },
              {
                "name": "EmailSettings__SmtpPort",
                "value": "587",
                "slotSetting": false
              },
              {
                "name": "EmailSettings__Username",
                "value": "${{ secrets.SMTP_USERNAME }}",
                "slotSetting": false
              },
              {
                "name": "EmailSettings__Password",
                "value": "${{ secrets.SMTP_PASSWORD }}",
                "slotSetting": false
              },
              {
                "name": "ApplicationInsights__ConnectionString",
                "value": "${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}",
                "slotSetting": false
              }
            ]
        continue-on-error: true

      - name: 🔄 Apply database migrations
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.*
          dotnet ef database update \
            --project Rodavia.Web/Rodavia.Web/Rodavia.Web.csproj \
            --connection "${{ secrets.SQL_CONNECTION_STRING }}"
        continue-on-error: true

      - name: 🚪 Azure logout
        run: az logout

  health-check:
    name: Health Check
    needs: deploy-to-azure
    runs-on: ubuntu-latest

    steps:
      - name: ⏱️ Wait for app to be ready
        run: sleep 30

      - name: 🏥 Check website health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net)
          if [ $response -eq 200 ]; then
            echo "✅ Website is healthy (HTTP $response)"
          else
            echo "❌ Website returned HTTP $response"
            exit 1
          fi

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-to-azure, health-check]
    if: success()
    permissions:
      contents: none  # No permissions needed for notifications

    steps:
      - name: ✅ Success Notification
        run: |
          echo "══════════════════════════════════════════════"
          echo "✅ AZURE DEPLOYMENT - COMPLETED SUCCESSFULLY"
          echo "══════════════════════════════════════════════"
          echo "📦 Build & Test: ${{ needs.build-and-test.result }}"
          echo "🚀 Deploy: ${{ needs.deploy-to-azure.result }}"
          echo "🏥 Health Check: ${{ needs.health-check.result }}"
          echo "══════════════════════════════════════════════"
          echo "🎉 Application deployed and healthy!"
          echo "🌐 URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

      # Opcional: Integración con Slack
      # - name: 📧 Send Slack notification
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     text: 'Rodavia deployment to Azure: Success ✅'
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      #   continue-on-error: true

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-to-azure, health-check]
    if: failure()
    permissions:
      contents: none  # No permissions needed for notifications

    steps:
      - name: ❌ Failure Notification
        run: |
          echo "══════════════════════════════════════════════"
          echo "❌ AZURE DEPLOYMENT - FAILED"
          echo "══════════════════════════════════════════════"
          echo "📦 Build & Test: ${{ needs.build-and-test.result }}"
          echo "🚀 Deploy: ${{ needs.deploy-to-azure.result }}"
          echo "🏥 Health Check: ${{ needs.health-check.result }}"
          echo "══════════════════════════════════════════════"
          echo "⚠️ Please review the failed jobs above"
          echo "📝 Check the logs for detailed error messages"
          echo ""
          echo "🔧 Common issues:"
          echo "   - AZURE_CREDENTIALS secret not configured correctly"
          echo "   - Service Principal lacks permissions"
          echo "   - App Service name mismatch"
          echo "   - Network or Azure service issues"
          echo "   - Database migration failures"

      # Opcional: Notificar fallo por Slack
      # - name: 📧 Send failure notification
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     text: 'Rodavia deployment to Azure: Failed ❌'
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      #   continue-on-error: true

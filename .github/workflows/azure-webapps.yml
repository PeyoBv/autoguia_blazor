# Workflow de CI/CD para Rodavia - Despliegue a Azure App Service
# Este workflow se ejecuta automáticamente cuando se hace push a la rama main
# Compila la aplicación Blazor .NET 8 y la despliega a Azure App Service
#
# REQUISITOS:
# - Secreto requerido: AZUREAPPSERVICE_PUBLISHPROFILE
#   (Descargar desde Azure Portal > App Service > Get publish profile)
# - El App Service debe llamarse 'rodavia' en Azure
# - Proyecto principal: Rodavia.Web/Rodavia.Web/Rodavia.Web.csproj
#
# ESTRUCTURA DEL WORKFLOW:
# 1. Build (restore, build, publish)
# 2. Deploy (despliegue a Azure)
# 3. Notificaciones (éxito/fallo)

name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecución manual del workflow

env:
  DOTNET_VERSION: '8.x'  # Versión de .NET a utilizar
  AZURE_WEBAPP_NAME: 'rodavia'  # Nombre del Azure App Service
  AZURE_WEBAPP_PACKAGE_PATH: './publish'  # Ruta donde se publicará la app
  PROJECT_PATH: 'Rodavia.Web/Rodavia.Web/Rodavia.Web.csproj'

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el código fuente del repositorio
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Descarga todo el historial para análisis completo

      # Paso 2: Configurar .NET SDK
      - name: 🔧 Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Paso 3: Restaurar dependencias NuGet
      - name: 📦 Restore dependencies
        run: dotnet restore

      # Paso 4: Compilar la solución en modo Release
      - name: 🏗️ Build solution
        run: dotnet build --configuration Release --no-restore

      # Paso 5: Ejecutar tests (opcional - comentado por defecto)
      # Descomenta las siguientes líneas si tienes tests unitarios
      # - name: 🧪 Run tests
      #   run: dotnet test --configuration Release --no-build --verbosity normal

      # Paso 6: Publicar la aplicación
      - name: 📤 Publish application
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Paso 7: Upload del artifact para deployment
      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      # Paso 1: Descargar artifact del build job
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-package
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Paso 2: Desplegar a Azure App Service
      - name: 🚀 Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Paso 3: Verificación post-despliegue
      - name: ✅ Deployment completed
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "🌐 Application URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: success()

    steps:
      - name: ✅ Success Notification
        run: |
          echo "══════════════════════════════════════════════"
          echo "✅ AZURE DEPLOYMENT - COMPLETED SUCCESSFULLY"
          echo "══════════════════════════════════════════════"
          echo "📦 Build: ${{ needs.build.result }}"
          echo "🚀 Deploy: ${{ needs.deploy.result }}"
          echo "══════════════════════════════════════════════"
          echo "🎉 Application deployed successfully!"
          echo "🌐 URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()

    steps:
      - name: ❌ Failure Notification
        run: |
          echo "══════════════════════════════════════════════"
          echo "❌ AZURE DEPLOYMENT - FAILED"
          echo "══════════════════════════════════════════════"
          echo "📦 Build: ${{ needs.build.result }}"
          echo "🚀 Deploy: ${{ needs.deploy.result }}"
          echo "══════════════════════════════════════════════"
          echo "⚠️ Please review the failed jobs above"
          echo "📝 Check the logs for detailed error messages"
          echo ""
          echo "🔧 Common issues:"
          echo "   - AZUREAPPSERVICE_PUBLISHPROFILE secret not configured"
          echo "   - App Service name mismatch (should be 'rodavia')"
          echo "   - Build errors in the application"
          echo "   - Publish profile expired or invalid"

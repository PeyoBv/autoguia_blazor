<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <style>
      .icon-primary { fill: none; stroke: #0d6efd; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #0d6efd; opacity: 0.1; }
      .icon-accent { fill: #212529; }
    </style>
  </defs>
  
  <!-- Truck Body -->
  <rect class="icon-fill" x="10" y="24" width="28" height="16" rx="2"/>
  <rect class="icon-primary" x="10" y="24" width="28" height="16" rx="2"/>
  
  <!-- Truck Cabin -->
  <path class="icon-fill" d="M 38 26 L 50 26 L 50 40 L 38 40 Z"/>
  <path class="icon-primary" d="M 38 26 L 50 26 L 50 40 L 38 40 Z"/>
  <rect class="icon-primary" x="40" y="28" width="8" height="6" rx="1"/>
  
  <!-- Wheels -->
  <circle class="icon-primary" cx="20" cy="44" r="5"/>
  <circle class="icon-accent" cx="20" cy="44" r="2"/>
  
  <circle class="icon-primary" cx="44" cy="44" r="5"/>
  <circle class="icon-accent" cx="44" cy="44" r="2"/>
  
  <!-- Speed Lines -->
  <line class="icon-primary" x1="6" y1="20" x2="10" y2="20" stroke-width="2" opacity="0.6"/>
  <line class="icon-primary" x1="4" y1="26" x2="10" y2="26" stroke-width="2" opacity="0.6"/>
  <line class="icon-primary" x1="6" y1="32" x2="10" y2="32" stroke-width="2" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <style>
      .icon-primary { fill: none; stroke: #0d6efd; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #0d6efd; opacity: 0.1; }
      .icon-accent { fill: #0d6efd; }
    </style>
  </defs>
  
  <!-- Headset Band -->
  <path class="icon-primary" d="M 20 24 Q 20 14 32 14 Q 44 14 44 24"/>
  
  <!-- Left Speaker -->
  <rect class="icon-fill" x="14" y="24" width="10" height="14" rx="2"/>
  <rect class="icon-primary" x="14" y="24" width="10" height="14" rx="2"/>
  <line class="icon-primary" x1="16" y1="28" x2="16" y2="34"/>
  
  <!-- Right Speaker -->
  <rect class="icon-fill" x="40" y="24" width="10" height="14" rx="2"/>
  <rect class="icon-primary" x="40" y="24" width="10" height="14" rx="2"/>
  <line class="icon-primary" x1="48" y1="28" x2="48" y2="34"/>
  
  <!-- Microphone -->
  <path class="icon-primary" d="M 44 38 L 44 42 Q 44 46 40 48 L 34 48"/>
  <circle class="icon-accent" cx="32" cy="48" r="3"/>
  
  <!-- Support Badge (24/7) -->
  <circle class="icon-accent" cx="46" cy="16" r="2.5"/>
</svg>

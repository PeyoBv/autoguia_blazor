<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a58ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d6efd;stop-opacity:1" />
    </linearGradient>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle (Optional) -->
  <circle cx="40" cy="40" r="38" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <g transform="translate(15, 18)" filter="url(#iconShadow)">
    <!-- Wheels -->
    <circle cx="12" cy="36" r="10" fill="#475569" stroke="#0d6efd" stroke-width="2.5"/>
    <circle cx="12" cy="36" r="5" fill="#0d6efd"/>
    <circle cx="12" cy="36" r="2" fill="#ffffff" opacity="0.8"/>
    
    <circle cx="42" cy="36" r="10" fill="#475569" stroke="#0d6efd" stroke-width="2.5"/>
    <circle cx="42" cy="36" r="5" fill="#0d6efd"/>
    <circle cx="42" cy="36" r="2" fill="#ffffff" opacity="0.8"/>
    
    <!-- Car Body -->
    <path d="M 2 32 L 5 18 Q 8 6 16 4 L 30 4 Q 38 6 43 12 L 48 20 Q 50 24 52 28 L 52 32 Z" 
          fill="url(#iconGrad)" stroke="#0a58ca" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Windshield -->
    <path d="M 12 16 Q 15 8 22 6 L 34 6 Q 41 8 44 16 Z" 
          fill="#60a5fa" opacity="0.6" stroke="#0d6efd" stroke-width="1.5"/>
    
    <!-- Side Windows -->
    <rect x="8" y="18" width="12" height="10" rx="1.5" fill="#93c5fd" opacity="0.7"/>
    <rect x="40" y="18" width="8" height="10" rx="1.5" fill="#93c5fd" opacity="0.7"/>
    
    <!-- Front Light -->
    <circle cx="50" cy="26" r="3" fill="#fbbf24" opacity="0.9"/>
    
    <!-- Detail Line (Hood) -->
    <line x1="14" y1="30" x2="40" y2="30" stroke="#0a58ca" stroke-width="1" opacity="0.3"/>
    
    <!-- Speed Lines (Motion Effect) -->
    <g opacity="0.5">
      <line x1="-2" y1="16" x2="2" y2="16" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-3" y1="24" x2="3" y2="24" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-2" y1="32" x2="2" y2="32" stroke="#0d6efd" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sedanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowSedan" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Sedan Body -->
  <g filter="url(#shadowSedan)">
    <!-- Main body (longer, sleeker) -->
    <rect x="120" y="390" width="560" height="130" rx="18" fill="url(#sedanGrad)"/>
    
    <!-- Hood (more aerodynamic) -->
    <path d="M 220 390 Q 250 340 340 325 L 460 325 Q 550 340 580 390 Z" fill="url(#sedanGrad)" opacity="0.92"/>
    
    <!-- Trunk -->
    <path d="M 580 390 Q 620 395 650 410 L 650 480 Q 640 495 620 500 L 580 500 Z" fill="url(#sedanGrad)" opacity="0.85"/>
    
    <!-- Windshield -->
    <path d="M 270 370 Q 305 335 400 328 Q 495 335 530 370 Z" fill="#818cf8" opacity="0.5"/>
    
    <!-- Windows -->
    <rect x="150" y="400" width="90" height="75" rx="6" fill="#a5b4fc" opacity="0.4"/>
    <rect x="260" y="400" width="200" height="75" rx="6" fill="#a5b4fc" opacity="0.4"/>
    <rect x="480" y="400" width="90" height="75" rx="6" fill="#a5b4fc" opacity="0.4"/>
    <rect x="590" y="400" width="50" height="75" rx="6" fill="#a5b4fc" opacity="0.35"/>
    
    <!-- Front Lights -->
    <ellipse cx="140" cy="420" rx="20" ry="12" fill="#fbbf24"/>
    <ellipse cx="660" cy="450" rx="15" ry="10" fill="#ef4444"/>
    
    <!-- Wheels -->
    <circle cx="230" cy="520" r="65" fill="#1f2937"/>
    <circle cx="230" cy="520" r="38" fill="#374151"/>
    <circle cx="230" cy="520" r="22" fill="#6b7280"/>
    
    <circle cx="570" cy="520" r="65" fill="#1f2937"/>
    <circle cx="570" cy="520" r="38" fill="#374151"/>
    <circle cx="570" cy="520" r="22" fill="#6b7280"/>
    
    <!-- Side mirror -->
    <ellipse cx="240" cy="405" rx="12" ry="8" fill="#4338ca"/>
    
    <!-- Door handle -->
    <rect x="340" y="460" width="35" height="8" rx="4" fill="#312e81" opacity="0.6"/>
    
    <!-- Ground shadow (elongated) -->
    <ellipse cx="400" cy="610" rx="320" ry="32" fill="#000000" opacity="0.1"/>
  </g>
  
  <!-- Label -->
  <text x="400" y="690" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#475569" text-anchor="middle">
    Sedán Ejecutivo
  </text>
  <text x="400" y="730" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">
    Imagen de referencia
  </text>
</svg>

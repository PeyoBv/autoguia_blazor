<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Car Body -->
  <g filter="url(#shadow)">
    <!-- Main body -->
    <rect x="150" y="400" width="500" height="120" rx="15" fill="url(#carGrad)"/>
    
    <!-- Hood -->
    <path d="M 250 400 Q 280 350 350 340 L 450 340 Q 520 350 550 400 Z" fill="url(#carGrad)" opacity="0.9"/>
    
    <!-- Windshield -->
    <path d="M 280 380 Q 310 350 400 345 Q 490 350 520 380 Z" fill="#60a5fa" opacity="0.6"/>
    
    <!-- Windows -->
    <rect x="180" y="410" width="80" height="60" rx="5" fill="#93c5fd" opacity="0.5"/>
    <rect x="280" y="410" width="240" height="60" rx="5" fill="#93c5fd" opacity="0.5"/>
    <rect x="540" y="410" width="80" height="60" rx="5" fill="#93c5fd" opacity="0.5"/>
    
    <!-- Front Lights -->
    <circle cx="170" cy="430" r="15" fill="#fbbf24"/>
    <circle cx="630" cy="430" r="15" fill="#fbbf24"/>
    
    <!-- Wheels -->
    <circle cx="250" cy="520" r="60" fill="#1f2937"/>
    <circle cx="250" cy="520" r="35" fill="#374151"/>
    <circle cx="250" cy="520" r="20" fill="#6b7280"/>
    
    <circle cx="550" cy="520" r="60" fill="#1f2937"/>
    <circle cx="550" cy="520" r="35" fill="#374151"/>
    <circle cx="550" cy="520" r="20" fill="#6b7280"/>
    
    <!-- Details -->
    <rect x="380" y="505" width="40" height="15" rx="3" fill="#fbbf24" opacity="0.8"/>
    
    <!-- Ground shadow -->
    <ellipse cx="400" cy="600" rx="300" ry="30" fill="#000000" opacity="0.1"/>
  </g>
  
  <!-- Label -->
  <text x="400" y="680" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#475569" text-anchor="middle">
    Auto Compacto
  </text>
  <text x="400" y="720" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">
    Imagen de referencia
  </text>
</svg>

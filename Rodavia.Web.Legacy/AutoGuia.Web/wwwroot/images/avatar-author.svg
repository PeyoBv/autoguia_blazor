<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Vignette effect -->
  <circle cx="200" cy="200" r="200" fill="none" stroke="#9ca3af" stroke-width="60" opacity="0.1"/>
  
  <g filter="url(#softShadow)">
    <!-- Shoulders/Body -->
    <ellipse cx="200" cy="380" rx="140" ry="80" fill="#3b82f6" opacity="0.9"/>
    
    <!-- Neck -->
    <rect x="175" y="280" width="50" height="70" rx="10" fill="#fbbf24" opacity="0.95"/>
    
    <!-- Head -->
    <circle cx="200" cy="200" r="90" fill="url(#skinGrad)"/>
    
    <!-- Ear left -->
    <ellipse cx="120" cy="210" rx="15" ry="25" fill="#f59e0b" opacity="0.9"/>
    
    <!-- Ear right -->
    <ellipse cx="280" cy="210" rx="15" ry="25" fill="#f59e0b" opacity="0.9"/>
    
    <!-- Hair -->
    <path d="M 110 160 Q 110 100 200 95 Q 290 100 290 160 L 290 180 Q 285 170 280 165 Q 275 160 270 160 L 130 160 Q 125 160 120 165 Q 115 170 110 180 Z" fill="#1f2937"/>
    
    <!-- Forehead hair detail -->
    <ellipse cx="200" cy="110" rx="85" ry="40" fill="#1f2937"/>
    
    <!-- Eyes -->
    <ellipse cx="170" cy="190" rx="12" ry="16" fill="#ffffff"/>
    <ellipse cx="230" cy="190" rx="12" ry="16" fill="#ffffff"/>
    <circle cx="172" cy="192" r="8" fill="#1f2937"/>
    <circle cx="232" cy="192" r="8" fill="#1f2937"/>
    <circle cx="174" cy="190" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="234" cy="190" r="3" fill="#ffffff" opacity="0.8"/>
    
    <!-- Eyebrows -->
    <path d="M 150 175 Q 170 170 185 172" stroke="#1f2937" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 215 172 Q 230 170 250 175" stroke="#1f2937" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Nose -->
    <path d="M 200 200 L 195 225 Q 200 230 205 225 L 200 200" fill="#f59e0b" opacity="0.5"/>
    
    <!-- Smile -->
    <path d="M 175 240 Q 200 250 225 240" stroke="#dc2626" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Glasses (optional professional touch) -->
    <g opacity="0.7">
      <circle cx="170" cy="190" r="25" fill="none" stroke="#374151" stroke-width="3"/>
      <circle cx="230" cy="190" r="25" fill="none" stroke="#374151" stroke-width="3"/>
      <line x1="195" y1="190" x2="205" y2="190" stroke="#374151" stroke-width="3"/>
      <path d="M 145 188 L 130 185" stroke="#374151" stroke-width="2"/>
      <path d="M 255 188 L 270 185" stroke="#374151" stroke-width="2"/>
    </g>
    
    <!-- Shirt collar -->
    <path d="M 160 340 L 175 310 L 200 320 L 225 310 L 240 340" fill="#1e40af" opacity="0.9"/>
  </g>
  
  <!-- Subtle highlight on face -->
  <ellipse cx="180" cy="170" rx="25" ry="35" fill="#ffffff" opacity="0.1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <linearGradient id="logoGradV" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car Icon Mark (Centered) -->
  <g transform="translate(40, 20)">
    <!-- Wheels -->
    <circle cx="15" cy="40" r="10" fill="#475569" stroke="#0d6efd" stroke-width="2.5"/>
    <circle cx="15" cy="40" r="5" fill="#0d6efd"/>
    
    <circle cx="50" cy="40" r="10" fill="#475569" stroke="#0d6efd" stroke-width="2.5"/>
    <circle cx="50" cy="40" r="5" fill="#0d6efd"/>
    
    <!-- Car Body -->
    <path d="M 5 35 L 8 22 Q 10 10 18 8 L 32 8 Q 42 10 47 16 L 55 25 Q 58 28 60 32 L 60 35 Z" 
          fill="url(#logoGradV)" stroke="#0a58ca" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Windshield -->
    <path d="M 14 20 Q 17 12 24 10 L 38 10 Q 45 12 48 20 Z" 
          fill="#60a5fa" opacity="0.5" stroke="#0d6efd" stroke-width="1.5"/>
    
    <!-- Windows -->
    <rect x="10" y="22" width="13" height="10" rx="1.5" fill="#93c5fd" opacity="0.6"/>
    <rect x="48" y="22" width="8" height="10" rx="1.5" fill="#93c5fd" opacity="0.6"/>
    
    <!-- Front Light -->
    <circle cx="58" cy="30" r="3" fill="#fbbf24"/>
    
    <!-- Speed Lines -->
    <line x1="0" y1="20" x2="4" y2="20" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="0" y1="28" x2="5" y2="28" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>
  
  <!-- Wordmark "AutoGuía" (Centered Vertical) -->
  <g>
    <text x="70" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b" letter-spacing="-0.5" text-anchor="middle">
      Auto
    </text>
    
    <text x="70" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="url(#logoGradV)" letter-spacing="-0.5" text-anchor="middle">
      Guía
    </text>
  </g>
  
  <!-- Tagline -->
  <text x="70" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#64748b" letter-spacing="0.8" text-anchor="middle">
    PLATAFORMA AUTOMOTRIZ
  </text>
</svg>

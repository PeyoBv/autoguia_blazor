<svg xmlns="http://www.w3.org/2000/svg" width="240" height="80" viewBox="0 0 240 80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car Icon Mark -->
  <g id="carMark">
    <!-- Wheels -->
    <circle cx="20" cy="52" r="9" fill="#475569" stroke="#0d6efd" stroke-width="2"/>
    <circle cx="20" cy="52" r="4" fill="#0d6efd"/>
    
    <circle cx="52" cy="52" r="9" fill="#475569" stroke="#0d6efd" stroke-width="2"/>
    <circle cx="52" cy="52" r="4" fill="#0d6efd"/>
    
    <!-- Car Body -->
    <path d="M 10 48 L 12 38 Q 14 28 20 26 L 32 26 Q 38 28 42 32 L 50 38 Q 54 40 58 42 L 62 48 Z" 
          fill="url(#logoGrad)" stroke="#0a58ca" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Windshield -->
    <path d="M 18 36 Q 20 30 26 28 L 36 28 Q 42 30 44 36 Z" 
          fill="#60a5fa" opacity="0.5" stroke="#0d6efd" stroke-width="1"/>
    
    <!-- Window -->
    <rect x="15" y="38" width="11" height="8" rx="1" fill="#93c5fd" opacity="0.6"/>
    <rect x="48" y="38" width="8" height="8" rx="1" fill="#93c5fd" opacity="0.6"/>
    
    <!-- Front Light -->
    <circle cx="60" cy="44" r="2.5" fill="#fbbf24"/>
    
    <!-- Speed Lines (Motion) -->
    <line x1="5" y1="35" x2="8" y2="35" stroke="#0d6efd" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="3" y1="42" x2="7" y2="42" stroke="#0d6efd" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
  
  <!-- Wordmark "AutoGuía" -->
  <g id="wordmark">
    <!-- "Auto" -->
    <text x="80" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" letter-spacing="-0.5">
      Auto
    </text>
    
    <!-- "Guía" with accent -->
    <text x="80" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="url(#logoGrad)" letter-spacing="-0.5">
      Guía
    </text>
  </g>
  
  <!-- Tagline (optional) -->
  <text x="80" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#64748b" letter-spacing="0.5">
    TU PLATAFORMA AUTOMOTRIZ
  </text>
</svg>

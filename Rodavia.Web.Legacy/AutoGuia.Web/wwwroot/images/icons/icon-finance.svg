<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <style>
      .icon-primary { fill: none; stroke: #0d6efd; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #0d6efd; opacity: 0.1; }
      .icon-accent { fill: #0d6efd; }
    </style>
  </defs>
  
  <!-- Credit Card -->
  <rect class="icon-fill" x="12" y="20" width="40" height="26" rx="3"/>
  <rect class="icon-primary" x="12" y="20" width="40" height="26" rx="3"/>
  
  <!-- Magnetic Strip -->
  <rect class="icon-accent" x="12" y="26" width="40" height="6" opacity="0.3"/>
  
  <!-- Chip -->
  <rect class="icon-primary" x="16" y="34" width="8" height="6" rx="1"/>
  <line class="icon-primary" x1="18" y1="36" x2="22" y2="36" stroke-width="1.5"/>
  <line class="icon-primary" x1="18" y1="38" x2="22" y2="38" stroke-width="1.5"/>
  
  <!-- Card Details (abstract lines) -->
  <line class="icon-primary" x1="28" y1="36" x2="48" y2="36" stroke-width="2"/>
  <line class="icon-primary" x1="28" y1="40" x2="42" y2="40" stroke-width="2"/>
  
  <!-- Percent Symbol (financing) -->
  <circle class="icon-accent" cx="42" cy="14" r="2.5"/>
  <line class="icon-primary" x1="38" y1="18" x2="46" y2="10" stroke-width="2"/>
  <circle class="icon-accent" cx="46" cy="10" r="2.5"/>
</svg>
